name: Validate and draft release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: pmo-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-package-and-draft:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve deterministic metadata
        run: |
          $ErrorActionPreference = 'Stop'
          $model = Get-Content -LiteralPath '.\src\js\10-model.js' -Raw -Encoding UTF8
          $match = [regex]::Match($model, 'model\.APP_VERSION\s*=\s*[''"](?<version>[^''"]+)[''"]')
          if (-not $match.Success) { throw 'APP_VERSION not found.' }
          $sourceVersion = $match.Groups['version'].Value

          if ($env:GITHUB_REF -like 'refs/tags/*') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$') {
              throw "Stable release tag must be vX.Y.Z: $env:GITHUB_REF_NAME"
            }
            $version = $Matches['version']
            if ($version -ne $sourceVersion) {
              throw "Tag $version differs from APP_VERSION $sourceVersion."
            }
          }
          else {
            $version = $sourceVersion
          }

          $timestamp = (git show -s --format=%cI $env:GITHUB_SHA).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($timestamp)) {
            throw 'Could not resolve commit timestamp.'
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8 -Value "PMO_BUILD_VERSION=$version"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8 -Value "PMO_BUILD_COMMIT=$env:GITHUB_SHA"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8 -Value "PMO_BUILD_TIMESTAMP=$timestamp"

      - name: Pin development JavaScript runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Run PowerShell 5.1 tests
        run: |
          .\tests\Run-Tests.ps1 `
            -Version $env:PMO_BUILD_VERSION `
            -Commit $env:PMO_BUILD_COMMIT `
            -BuildTimestamp $env:PMO_BUILD_TIMESTAMP

      - name: Validate architecture context
        run: .\tools\validar-contexto.ps1 -Detalhado

      - name: Exercise updater recovery journals
        run: .\tests\Test-UpdaterRecovery.ps1

      - name: Exercise local persistence and update API
        run: .\tests\Invoke-ServerIntegration.ps1

      - name: Build release assets
        run: |
          .\tools\New-ReleasePackage.ps1 `
            -Version $env:PMO_BUILD_VERSION `
            -Commit $env:PMO_BUILD_COMMIT `
            -BuildTimestamp $env:PMO_BUILD_TIMESTAMP `
            -OutputDirectory '.\artifacts'

          $zip = ".\artifacts\pmo-tool-$env:PMO_BUILD_VERSION-windows.zip"
          $manifest = ".\artifacts\pmo-tool-$env:PMO_BUILD_VERSION-manifest.json"
          $bootstrap = ".\artifacts\pmo-tool-$env:PMO_BUILD_VERSION-bootstrap.zip"
          .\tools\Test-ReleasePackage.ps1 -ZipPath $zip -ManifestPath $manifest
          .\tools\Test-BootstrapPackage.ps1 -ZipPath $bootstrap -ManifestPath $manifest

      - name: Install from built artifacts offline
        run: |
          $ErrorActionPreference = 'Stop'
          # Instala a partir dos artefatos que seriam publicados, nao dos que a
          # suite constroi. Offline: -PacoteLocal nao toca a rede.
          $destino = Join-Path $env:RUNNER_TEMP 'pmo-smoke'
          if (Test-Path -LiteralPath $destino) { Remove-Item -LiteralPath $destino -Recurse -Force }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\pmo-instalar.ps1 `
            -PacoteLocal '.\artifacts' -InstallDir $destino -Repositorio $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Instalacao offline a partir dos artefatos falhou.' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $destino 'pmo.ps1') -Diagnostico | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostico da instalacao de smoke test falhou.' }
          Remove-Item -LiteralPath $destino -Recurse -Force

      - name: Preserve validated workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmo-tool-validated-${{ github.run_id }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Create immutable-candidate draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $previousErrorActionPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            gh release view $env:GITHUB_REF_NAME --json id 2>$null | Out-Null
            $releaseViewExitCode = $LASTEXITCODE
          }
          finally {
            $ErrorActionPreference = $previousErrorActionPreference
          }
          if ($releaseViewExitCode -eq 0) {
            throw "Release $env:GITHUB_REF_NAME already exists; assets will not be replaced."
          }

          # Allowlist nominal: contar arquivos nao diz se sao os certos, e o
          # conjunto cresce a cada artefato novo. Nome a nome, um extra ou um
          # faltante bloqueia a release.
          $esperados = @(
            "pmo-tool-$env:PMO_BUILD_VERSION-windows.zip",
            "pmo-tool-$env:PMO_BUILD_VERSION-windows.zip.sha256",
            "pmo-tool-$env:PMO_BUILD_VERSION-manifest.json",
            "pmo-tool-$env:PMO_BUILD_VERSION-bootstrap.zip",
            'portable-common.ps1',
            'pmo-instalar.ps1'
          )
          $encontrados = @(Get-ChildItem -LiteralPath '.\artifacts' -File | ForEach-Object { $_.Name })
          $faltando = @($esperados | Where-Object { $encontrados -cnotcontains $_ })
          $extras = @($encontrados | Where-Object { $esperados -cnotcontains $_ })
          if ($faltando.Count -gt 0) { throw "Missing release assets: $($faltando -join ', ')" }
          if ($extras.Count -gt 0) { throw "Unexpected release assets: $($extras -join ', ')" }
          $assets = @($esperados | ForEach-Object { (Resolve-Path -LiteralPath (Join-Path '.\artifacts' $_)).Path })
          gh release create $env:GITHUB_REF_NAME $assets `
            --draft `
            --verify-tag `
            --generate-notes `
            --title "PMO Tool $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub draft release creation failed.'
          }
          Write-Host 'Draft created. Human review and publication are required.'
